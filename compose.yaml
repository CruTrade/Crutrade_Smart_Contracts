services:
  local:
    build: .
    image: crutrade-contracts:local
    init: true
    ports:
      - "127.0.0.1:${CRUTRADE_RPC_PORT:-8545}:8545"
    volumes:
      - local-state:/data
    networks:
      - local-only
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/crutrade-ready && cast chain-id --rpc-url http://127.0.0.1:8545 | grep -qx 31337"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 12

  test:
    build: .
    image: crutrade-contracts:local
    profiles: [tools]
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["sh", "-c", "forge test --offline && node --test docker/local-stack.test.mjs"]

volumes:
  local-state:

networks:
  local-only:
    internal: true
